version: "3.8"

services:
  # ============================================================================
  # Agentic Workflow Automation Engine App
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow_engine_app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres_secure_pass}@db:5432/${POSTGRES_DB:-workflow_engine}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DEFAULT_OPS_EMAIL=${DEFAULT_OPS_EMAIL:-ops-team@company.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ALERTS_JSON_PATH=/app/data/alerts.json
      - PERFORMANCE_JSON_PATH=/app/data/performance_stats.json
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount data directory so telemetry JSON files can be inspected or updated live
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - automation_net

  # ============================================================================
  # Production PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: workflow_engine_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-workflow_engine}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workflow_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - automation_net

volumes:
  pgdata:
    driver: local

networks:
  automation_net:
    driver: bridge
