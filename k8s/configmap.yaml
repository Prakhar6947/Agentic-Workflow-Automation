apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-engine-config
  labels:
    app: workflow-engine
data:
  ENVIRONMENT: "production"
  PORT: "8000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "INFO"
  GUNICORN_WORKERS: "4"
  LLM_PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-2.5-flash"
  DEFAULT_OPS_EMAIL: "ops-team@company.com"
  ALERTS_JSON_PATH: "/app/data/alerts.json"
  PERFORMANCE_JSON_PATH: "/app/data/performance_stats.json"
