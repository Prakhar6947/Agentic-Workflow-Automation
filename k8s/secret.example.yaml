apiVersion: v1
kind: Secret
metadata:
  name: workflow-engine-secrets
  labels:
    app: workflow-engine
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://postgres:postgres_secure_pass@postgres-service:5432/workflow_engine"
  GOOGLE_API_KEY: "your-google-api-key-here"
  OPENAI_API_KEY: ""
  SMTP_HOST: "smtp.company.com"
